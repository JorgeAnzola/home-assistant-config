---
type: grid
title: Todo lo demás
view_layout:
  grid-area: others
columns: 1
cards:
  - type: custom:swipe-card
    start_card: 1
    parameters:
      autoplay:
        delay: 5200
        disableOnInteraction: false
      spaceBetween: 30
      speed: 650
      threshold: 7
    cards:
      - type: grid
        columns: 2
        cards:
          - type: custom:button-card
            entity: light.hallway
            name: Entrada
            template:
              - static_light
              - icon_spot
          - type: custom:button-card
            entity: light.second_floor
            name: Segundo piso
            template:
              - static_light
              - icon_spot
          - type: custom:button-card
            entity: light.stairs
            name: Escaleras
            template:
              - light
              - icon_stairs
          - type: custom:button-card
            entity: light.stairs_photo_frame
            name: Cuadro de la escalera
            template:
              - static_light
              - icon_wall_lamp
      - type: grid
        columns: 2
        cards:
          - type: custom:button-card
            entity: light.guests_bathroom
            name: Baño de visitas
            template:
              - static_light
              - icon_bathroom
          - type: custom:button-card
            entity: switch.air_fresheners
            name: Ambientadores
            template:
              - base
              - icon_air_freshener
            double_tap_action:
              action: more-info
          - type: custom:button-card
            entity: sensor.washer_washer_job_state
            name: Lavadora
            template:
              - base
              - icon_washing_machine
            tap_action:
              action: more-info
            double_tap_action:
              action: more-info
          - type: custom:button-card
            entity: switch.dryer
            name: Secadora
            template:
              - base
              - icon_dryer
            tap_action:
              action: more-info
            double_tap_action:
              action: more-info
