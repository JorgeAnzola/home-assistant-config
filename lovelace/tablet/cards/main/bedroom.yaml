---
type: grid
title: Cuarto
view_layout:
  grid-area: bedroom
columns: 1
cards:
  - type: custom:swipe-card
    start_card: 1
    parameters:
      autoplay:
        delay: 5100
        disableOnInteraction: false
      spaceBetween: 30
      speed: 650
      threshold: 7
    cards:
      - type: grid
        columns: 2
        cards:
          - type: custom:button-card
            entity: light.bedroom
            name: Luz
            template:
              - static_light
              - icon_spot
          - type: custom:button-card
            entity: light.bedroom_wall_led_strip
            name: Pared
            template:
              - light
              - icon_bedroom_wall
          - type: custom:button-card
            entity: fan.bedroom
            name: Ventilador
            template:
              - base
              - icon_fan
          - type: custom:button-card
            entity: light.closets
            name: Clóset
            template:
              - static_light
              - icon_closet
      - type: grid
        columns: 2
        cards:
          - type: custom:button-card
            entity: switch.bedroom_air_freshener
            name: Ambientador
            template:
              - base
              - icon_air_freshener
            double_tap_action:
              action: more-info
          - type: custom:button-card
            entity: switch.bedroom_repellent
            name: Repelente
            template:
              - base
              - icon_repellent
            double_tap_action:
              action: more-info
          - type: custom:button-card
            entity: light.bathroom
            name: Baño
            template:
              - static_light
              - icon_bathroom
          - type: custom:button-card
            entity: switch.bathroom_heater
            name: Calentador
            template:
              - base
              - icon_climate
      - type: grid
        columns: 1
        cards:
          - type: custom:button-card
            name: TV
            entity: media_player.bedroom_apple_tv
            template:
              - media
              - icon_apple_tv
