type: grid
title: Sala
view_layout:
  grid-area: living
columns: 1
cards:
  - type: custom:swipe-card
    start_card: 1
    parameters:
      autoplay:
        delay: 5000
        disableOnInteraction: false
      spaceBetween: 30
      speed: 650
      threshold: 7
    cards:
      - type: grid
        columns: 2
        cards:
          - type: custom:button-card
            entity: light.living_room_1
            name: Luz
            template:
              - static_light
              - icon_spot
          - type: custom:button-card
            entity: light.lamp
            name: Lámpara
            template:
              - static_light
              - icon_living_lamp
          - type: custom:button-card
            entity: light.deco_lamp
            name: Lamparita
            template:
              - static_light
              - icon_lamp
          - type: custom:button-card
            entity: light.living_room_decoration
            name: Decoración
            template:
              - static_light
              - icon_plant
      - type: grid
        columns: 2
        cards:
          - type: custom:button-card
            entity: fan.living_room_fireplace
            name: Chimenea
            template:
              - base
              - icon_fire_place
            double_tap_action:
              action: more-info
          - type: custom:button-card
            entity: switch.living_room_air_freshener
            name: Ambientador
            template:
              - base
              - icon_air_freshener
            double_tap_action:
              action: more-info
      - type: grid
        columns: 1
        cards:
          - type: custom:button-card
            entity: media_player.living_room_tv
            name: TV
            template:
              - media
              - icon_tv
