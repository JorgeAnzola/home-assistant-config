---
unique_id: sidebar
state: template
attributes:
  time: >
    {% set hours = now().strftime('%H') %}
    {% set minutes = now().strftime('%M') %}
    <span class="time" style="font-size: 5.2vw;font-weight: 100;line-height: 4.3vw;letter-spacing: 0.11vw;margin-left: -0.3vw;color: rgba(255, 255, 255, 0.8);">
      {{ hours }}<span class="time-colon">:</span>{{ minutes }}
    </span>
  date: >
    <b style="font-weight: 700;color: rgba(255, 255, 255, 0.8);">
        {% set days = {"Monday": "Lunes", "Tuesday": "Martes", "Wednesday": "Miércoles", "Thursday": "Jueves", "Friday": "Viernes", "Saturday": "Sábado", "Sunday": "Domingo"} %}
        {% set months = {"Jan": "Ene", "Feb": "Feb", "Mar": "Mar", "Apr": "Abr", "May": "May", "Jun": "Jun", "Jul": "Jul", "Aug": "Ago", "Sep": "Sep", "Oct": "Oct", "Nov": "Nov", "Dec": "Dic"} %}
        {{ days[now().strftime('%A')] }}, {{ now().strftime('%d') }} {{ months[now().strftime('%b')] }}
      </b>
  greet: >
    <b style="font-weight: 700;color: rgba(255, 255, 255, 0.8);">
    {% set time = now().hour %}
    {% if time <= 1 %} Buenas noches 😪
    {% elif time <= 3 %} Buenas noches 😴
    {% elif time <= 5 %} Buenas noches 😑
    {% elif time <= 7 %} Buenos días 🥱
    {% elif time <= 9 %} Buenos días {{'\U00002615'}}
    {% elif time <= 12 %} Buenos días 😄
    {% elif time <= 15 %} Buenas tardes 😎
    {% elif time <= 17 %} Buenas tardes 👋🏻
    {% elif time <= 19 %} Buenas tardes 😬
    {% elif time <= 22 %} Buenas noches 😌
    {% elif time <= 23 %} Buenas noches 🥱
    {% else %} Buenas noches 😪
    {% endif %}
    </b>

  weather: >
    {% set feels_like = states('sensor.openweathermap_feels_like_temperature') | round %}
    {% set condition = states('sensor.openweathermap_condition') | lower %}
    {% set full_condition = states('sensor.openweathermap_weather') | lower %}
    {% set precipitation_probability = states('sensor.openweathermap_forecast_precipitation_probability') | int %}

    {% set emoji %}
    {% if condition == 'clear' %}🌞
    {% elif condition == 'partly cloudy' %}🌤️
    {% elif condition == 'cloudy' %}☁️
    {% elif condition == 'rain' %}☔️
    {% elif condition == 'thunderstorm' %}🌩️
    {% elif condition == 'snow' %}❄️☃️
    {% else %}🏡
    {% endif %}
    {% endset %}

    La sensación térmica es de {{ feels_like }}°, {{ full_condition }} {{ emoji }}<br/><br/>
    Con {{ precipitation_probability }}% de probabilidad de lluvia.<br/><br/>

    {% if condition == 'rain' %}
    Lleva un paraguas! ☂️
    {% elif condition == 'thunderstorm' %}
    Toma las precauciones necesarias para la tormenta. ⚡️
    {% elif precipitation_probability >= 50 %}
    considera llevar un paraguas. ☔️
    {% else %}
    No se esperan precipitaciones.
    {% endif %}
    <br/>
  calendar: >
    {% set calendars = [
        'calendar.birthdays',
        'calendar.bruno',
        'calendar.lake_house',
        'calendar.jorge_anzola_gmail_com'
    ] %}

    {% set tomorrowStartTimestamp = as_timestamp(now().date() + timedelta(days=1)) | int %}
    {% set tomorrowEndTimestamp = as_timestamp(now().date() + timedelta(days=2)) | int%}

    {% set todayStartTimestamp = as_timestamp(now().date()) | int %}

    {% set data = namespace(events=[],tomorrowEvents=[]) %}

    {% for calendar in calendars %}
        {% set startTime = state_attr(calendar, 'start_time') | as_timestamp | int %}
        {% set endTime = state_attr(calendar, 'end_time') | as_timestamp | int %}
        {% if todayStartTimestamp <= startTime and endTime <= tomorrowStartTimestamp %}
            {% set message = state_attr(calendar, 'message') %}
            {% if 'birthdays' in calendar %}
                {% set event = {
                    'name':'<strong style="color:white"> Cumpleaños de' + message + "</strong>",
                    'calendar': calendar.split('.')[-1]
                } %}
            {% elif 'bruno' in calendar %}
                {% set event = {
                    'name': '<strong style="color:white">Bruno: ' + message + '</strong>',
                    'calendar': calendar.split('.')[-1]
                } %}
            {% else %}
                {% set event = {
                    'name': '<strong style="color:white">' + message + '</strong>',
                    'calendar': calendar.split('.')[-1]
                } %}
            {% endif %}
            {% set data.events = data.events + [event] %}
        {% endif %}
        
        {% if startTime >= tomorrowStartTimestamp and endTime <= tomorrowEndTimestamp %}
            {% set message = state_attr(calendar, 'message') %}
            {% if 'birthdays' in calendar %}
                {% set tomorrowEvent = {
                    'name':'<strong style="color:white">' + message + "</strong>",
                    'calendar': calendar.split('.')[-1]
                } %}
            {% elif 'bruno' in calendar %}
                {% set tomorrowEvent = {
                    'name': '<strong style="color:white">Brunos ' + message + '</strong>',
                    'calendar': calendar.split('.')[-1]
                } %}
            {% else %}
                {% set tomorrowEvent = {
                    'name': '<strong style="color:white">' + message + '</strong>',
                    'calendar': calendar.split('.')[-1]
                } %}
            {% endif %}
            {% set data.tomorrowEvents = data.tomorrowEvents + [tomorrowEvent] %}
        {% endif %}
    {% endfor %}

    {% set eventCount = data.events | length %}

    {% if eventCount == 1 %}
        🗓️ Hoy: {{ data.events[0]['name'] }} 
    {% elif eventCount == 2 %}
        🗓️ Hoy:  {{ data.events[0]['name'] }} y {{ data.events[1]['name'] }}
    {% elif eventCount > 2 %}
        {% set remainingCount = eventCount - 2 %}
        🗓️ Hoy: {{ data.events[0]['name'] }}, {{ data.events[1]['name'] }} y {{ remainingCount }} otros
    {% endif %}

    {% set tomorrowEventCount = data.tomorrowEvents | length %}

    {% if tomorrowEventCount == 1 %}
        🗓️ Mañana: {{ data.tomorrowEvents[0]['name'] }} 
    {% elif tomorrowEventCount == 2 %}
        🗓️ Mañana:  {{ data.tomorrowEvents[0]['name'] }} y {{ data.tomorrowEvents[1]['name'] }}
    {% elif tomorrowEventCount > 2 %}
        {% set remainingCount = tomorrowEventCount - 2 %}
        🗓️ Mañana: {{ data.tomorrowEvents[0]['name'] }}, {{ data.tomorrowEvents[1]['name'] }} y {{ remainingCount }} otros
    {% endif %}


    {% set plastic = state_attr('sensor.hvc_groep_plastic', 'day') %}
    {% set paper = state_attr('sensor.hvc_groep_paper', 'day') %}

    {% if plastic == 'Vandaag' %}
        🟠 Recogerán el plástico hoy
    {% elif plastic == 'Morgen' %}
        🟠 Recogerán el plástico mañana
    {% endif %}

    {% if paper == 'Vandaag' %}
        🔵 Recogerán el papel hoy
    {% elif paper == 'Morgen' %}
        🔵 Recogerán el papel mañana
    {% endif %}
